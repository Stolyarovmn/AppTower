name: task2-finalize

on:
  push:
    branches:
      - chore/store-readiness-audit-fixes
    paths:
      - .github/workflows/task2-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/store-readiness-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply TASK2 runtime patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path("app/background.js")
          text = target.read_text(encoding="utf-8")

          patch_paths = [
              Path("tools/task2-patches/01-01.patch"),
              Path("tools/task2-patches/01-02.patch"),
              Path("tools/task2-patches/01-03.patch"),
              Path("tools/task2-patches/01-06.patch"),
              Path("tools/task2-patches/01-07.patch"),
          ]

          def parse_hunks(raw):
              lines = raw.splitlines(keepends=True)
              hunks = []
              i = 0
              while i < len(lines):
                  if not lines[i].startswith("@@ "):
                      i += 1
                      continue
                  header = lines[i].rstrip("\r\n")
                  i += 1
                  body = []
                  while i < len(lines) and not lines[i].startswith("@@ "):
                      line = lines[i]
                      if line.startswith(("diff --git ", "--- ", "+++ ")):
                          break
                      if line.startswith((" ", "+","-")):
                          body.append(line)
                      elif line.startswith("\\ No newline"):
                          pass
                      elif line.strip() == "":
                          # A bare blank is invalid unified-diff syntax. The
                          # staged fragments contain separator blanks; ignore
                          # those rather than inventing target context.
                          pass
                      else:
                          raise RuntimeError(f"Unsupported patch line after {header}: {line!r}")
                      i += 1
                  old = "".join(line[1:] for line in body if line[0] in " -")
                  new = "".join(line[1:] for line in body if line[0] in " +")
                  if not old:
                      raise RuntimeError(f"Empty old-side hunk: {header}")
                  hunks.append((header, old, new))
              return hunks

          for patch_path in patch_paths:
              hunks = parse_hunks(patch_path.read_text(encoding="utf-8"))
              print(f"{patch_path}: {len(hunks)} hunks")
              for header, old, new in hunks:
                  count = text.count(old)
                  if count != 1:
                      print(f"FAILED {header}: old block occurrences={count}")
                      print("OLD BLOCK START")
                      print(old[:4000])
                      print("OLD BLOCK END")
                      raise SystemExit(2)
                  text = text.replace(old, new, 1)
                  print(f"  applied {header}")

          target.write_text(text, encoding="utf-8")
          PY

      - name: Validate source
        run: node tools/validate.mjs
      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium extension E2E
        run: xvfb-run -a npm run test:e2e
      - name: Rebuild fallback and package
        run: python tools/package.py

      - name: Commit finalized TASK2 runtime
        run: |
          set -euo pipefail
          git rm -r tools/task2-patches
          git rm .github/workflows/task2-finalize.yml
          git add app variants
          git config user.name "AppTower Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "task2: wire serialized state coordinator runtime"
          git push origin HEAD:chore/store-readiness-audit-fixes

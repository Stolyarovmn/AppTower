name: finalize-edge-panel

on:
  push:
    branches:
      - fix/edge-native-panel-regression

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply final source patch
        run: |
          git apply --check tools/edge-panel-finalize.patch
          git apply tools/edge-panel-finalize.patch
          rm tools/edge-panel-finalize.patch
          rm .github/workflows/finalize-edge-panel.yml
          python tools/make_yandex_variant.py

      - name: Validate source
        run: node tools/validate.mjs

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Chromium extension E2E
        run: xvfb-run -a npm run test:e2e

      - name: Commit finalized source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(edge): finalize native panel behavior and regressions"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push finalized source
        run: git push origin HEAD:fix/edge-native-panel-regression

      - name: Package exact finalized commit
        run: python tools/package.py

      - name: Upload ready packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-tower-ready-${{ steps.commit.outputs.sha }}
          path: |
            dist/*.zip
            dist/CHECKSUMS.sha256
            dist/BUILD_INFO.json

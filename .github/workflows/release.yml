name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or commit SHA
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install test dependencies
        working-directory: extension
        run: npm ci --ignore-scripts
      - name: Test and validate permissions
        working-directory: extension
        run: |
          npm test
          node tools/check-permissions.mjs
      - name: Build store ZIP and checksum
        run: |
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match manifest version v${VERSION}" >&2
            exit 1
          fi
          python extension/tools/package.py --output "dist/AppTower-${VERSION}.zip"
          sha256sum "dist/AppTower-${VERSION}.zip" > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: AppTower-${{ github.ref_name }}
          path: |
            dist/AppTower-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/AppTower-*.zip dist/SHA256SUMS.txt --generate-notes

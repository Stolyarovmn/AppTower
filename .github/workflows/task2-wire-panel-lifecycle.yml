name: task2-wire-panel-lifecycle

on:
  push:
    branches:
      - chore/store-readiness-audit-fixes
    paths:
      - tools/task2-wire-panel-lifecycle.py
      - .github/workflows/task2-wire-panel-lifecycle.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/store-readiness-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply TASK2 panel lifecycle wiring
        run: python tools/task2-wire-panel-lifecycle.py
      - name: Validate source
        run: node tools/validate.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Headed Chromium E2E
        run: xvfb-run -a npm run test:e2e
      - name: Rebuild fallback and package
        run: python tools/package.py

      - name: Commit validated TASK2 wiring
        run: |
          set -euo pipefail
          git rm tools/task2-wire-panel-lifecycle.py
          git rm .github/workflows/task2-wire-panel-lifecycle.yml
          git add app/background.js tests/unit/background-panel-lifecycle-wiring.test.mjs variants
          git config user.name "AppTower Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "task2: wire serialized panel lifecycle controller"
          git push origin HEAD:chore/store-readiness-audit-fixes

name: cleanroom-v2

on:
  push:
    branches:
      - rewrite/v2-cleanroom
    paths:
      - cleanroom/**
      - .github/workflows/cleanroom-v2.yml
  pull_request:
    paths:
      - cleanroom/**
      - .github/workflows/cleanroom-v2.yml

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('cleanroom/manifest.json','utf8'))"
      - name: Cleanroom unit and contract tests
        working-directory: cleanroom
        run: npm test
      - name: Verify no legacy imports or fixed extension key
        run: |
          ! grep -R "\.\./app\|/app/\|edge-manual-gate-fixes\|manual-gate-fixes\|rail-prelude\|rail-style-contract" cleanroom --include='*.js' --include='*.html' --include='*.css'
          ! grep -n '"key"' cleanroom/manifest.json

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новая вкладка</title><link rel="stylesheet" href="sidepanel.css"><style>body{display:grid;place-items:center}#compact[hidden]{display:none!important}.start{width:min(560px,90vw);padding:32px}.start h1{font-size:32px}.start input{width:100%;height:44px;border-radius:10px;padding:12px}.start button{margin:12px 8px 0 0;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel)}</style></head><body><aside id="compact" style="position:fixed;right:0;top:0;bottom:0;width:48px;padding:8px 5px;display:flex;flex-direction:column;border-left:1px solid var(--border)"><button id="disable" aria-label="Закрыть AppTower">×</button><button id="expand" aria-label="Развернуть AppTower">‹</button></aside><main class="start"><h1>Новая вкладка</h1><form id="address"><input id="url" aria-label="Адрес сайта" placeholder="Адрес сайта" required></form><button id="open">Открыть AppTower</button><button id="settings">Настройки</button></main><script type="module" src="newtab.js"></script></body></html>

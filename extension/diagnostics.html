<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AppTower Diagnostics</title><style>body{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#202020;color:#f2f2f2}main{max-width:1100px;margin:0 auto;padding:24px}h1{font-size:22px}p{color:#bbb}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{font:inherit;padding:8px 12px;border:1px solid #555;border-radius:6px;background:#2c2c2c;color:inherit;cursor:pointer}button:hover{background:#343434}.primary{background:#0f6cbd;border-color:#0f6cbd}.status{margin:12px 0;padding:10px 12px;border:1px solid #444;border-radius:6px;background:#252525}pre{white-space:pre-wrap;word-break:break-word;background:#111;padding:14px;border-radius:6px;border:1px solid #333;min-height:220px}.ok{color:#6ccb5f}.bad{color:#ff6b6b}</style></head><body><main><h1>AppTower Cleanroom Diagnostics</h1><p>Запусти self-test, затем воспроизведи проблему в Edge и нажми «Обновить отчёт». Отчёт содержит lifecycle, доступные методы Side Panel API и последние 500 событий.</p><div class="actions"><button id="self" class="primary">Запустить self-test</button><button id="refresh">Обновить отчёт</button><button id="copy">Копировать JSON</button><button id="download">Скачать JSON</button><button id="clear">Очистить журнал</button></div><div id="status" class="status">Готово.</div><pre id="output">Нажми «Обновить отчёт».</pre></main><script type="module" src="diagnostics.js"></script></body></html>

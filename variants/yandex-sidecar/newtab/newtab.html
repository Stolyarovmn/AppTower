<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Новая вкладка</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="start">
    <img src="../icons/icon48.png" class="logo" alt="">
    <h1>App Tower Next</h1>
    <p>App Tower уже приклеен к этому окну. Используйте адресную строку браузера или ярлыки справа.</p>
    <div class="hint"><kbd>Ctrl</kbd><span>+</span><kbd>L</kbd><span>— перейти к адресу</span></div>
  </main>
  <aside id="nt-rail" class="nt-rail" aria-label="App Tower">
    <div class="nt-chrome"><button id="nt-close" class="tool close" title="Отключить App Tower" aria-label="Отключить App Tower"></button></div>
    <div class="nt-head"><button id="nt-expand" class="tool" title="Развернуть App Tower" aria-label="Развернуть App Tower"><svg viewBox="0 0 16 16"><path d="M10.25 3.5 5.75 8l4.5 4.5"/></svg></button></div>
    <button id="nt-scroll-up" class="scroll-arrow hidden" type="button" aria-label="Прокрутить ярлыки вверх"><svg viewBox="0 0 16 16"><path d="M3.5 10.25 8 5.75l4.5 4.5"/></svg></button>
    <div id="nt-sites-scroll" class="nt-sites-scroll"><div id="nt-sites" class="nt-sites"></div></div>
    <button id="nt-scroll-down" class="scroll-arrow hidden" type="button" aria-label="Прокрутить ярлыки вниз"><svg viewBox="0 0 16 16"><path d="m3.5 5.75 4.5 4.5 4.5-4.5"/></svg></button>
    <div class="sep"></div>
    <button id="nt-add" class="tool plus" title="Добавить текущую страницу" aria-label="Добавить сайт"><svg class="tool-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="nt-group" class="tool group-tool" title="Группы и шаблоны" aria-label="Группы и шаблоны"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="10" height="10" rx="2"/><rect x="10" y="9" width="10" height="10" rx="2"/></svg></button>
    <div class="spacer"></div>
    <button id="nt-search" class="tool search-tool" title="Поиск · Ctrl+Shift+Space" aria-label="Поиск"><svg class="tool-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m14.5 14.5 4.5 4.5"/></svg></button>
    <button id="nt-settings" class="tool gear" title="Настройки" aria-label="Настройки"><span class="native-icon settings-native" aria-hidden="true">&#xE713;</span><svg class="tool-icon-svg settings-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.1"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4"/></svg></button>
  </aside>
  <script src="newtab.js" type="module"></script>
</body>
</html>
